services:
  - type: web
    name: kairos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RUN_EMBEDDED_WORKERS
        value: "true"
      - key: ENVIRONMENT
        value: production
      # Optional: Add Neon PostgreSQL and Upstash Redis connection strings in Render Dashboard
      # - key: DATABASE_URL
      #   sync: false
      # - key: REDIS_URL
      #   sync: false
