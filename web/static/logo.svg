<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- KAIROS Modern Monogram Logo -->
  <defs>
    <linearGradient id="kairos-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="kairos-grad-accent" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="kairos-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="48" height="48" rx="12" fill="#0C1322" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Left Vertical Spine Pillar -->
  <path d="M14 11V37" stroke="url(#kairos-grad-primary)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Convergence Diagonals forming the 'K' and Convergence Apex -->
  <!-- Upper Convergence Beam -->
  <path d="M34 13L18 24" stroke="url(#kairos-grad-accent)" stroke-width="4" stroke-linecap="round" filter="url(#kairos-glow)" />
  
  <!-- Lower Convergence Beam -->
  <path d="M21 21.5L34 35" stroke="url(#kairos-grad-primary)" stroke-width="4" stroke-linecap="round" />

  <!-- Decision Point Apex Node -->
  <circle cx="21" cy="24" r="2.5" fill="#FFFFFF" />
  <circle cx="21" cy="24" r="4.5" stroke="#34D399" stroke-width="1.2" opacity="0.8" />
</svg>
